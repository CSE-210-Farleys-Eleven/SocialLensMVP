version: 2
updates:
  # One grouped PR per week instead of one per package. Major bumps are left to a human.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    commit-message: { prefix: "chore(repo)" }
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    commit-message: { prefix: "ci(repo)" }
    groups:
      actions:
        patterns: ["*"]
