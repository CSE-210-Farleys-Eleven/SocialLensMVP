name: release
# Manual: Actions > release > Run workflow, enter the version (e.g. 0.2.0).
# package.json on main must already say that version (bump it in a normal PR first).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version, no leading v (e.g. 0.2.0). Must equal package.json."
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: release
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Validate version
        env: { VERSION: "${{ inputs.version }}" }
        run: node scripts/check-release-version.mjs "$VERSION"
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes $flags
