name: ci
on:
  push: { branches: [main] }
  pull_request:
    types: [opened, synchronize, reopened, edited]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run boundaries
      - run: npm run coverage -- --coverage.reporter=text-summary --coverage.reporter=lcov
      - uses: actions/upload-artifact@v7
        if: matrix.node == 22
        with: { name: coverage, path: coverage/lcov.info, if-no-files-found: ignore }

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report/, if-no-files-found: ignore }

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Title follows contracts/COMMITS.md
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|refactor|test|docs|ci|chore)\((adapters|auth|accounts|registry|normalize|analytics|ui|shared|repo|transition)\)!?: [a-z0-9].{0,70}[^.]$'
          if ! printf '%s' "$TITLE" | grep -Eq "$re"; then
            echo "PR title must look like: <type>(<module>): <summary>  (see contracts/COMMITS.md)"
            echo "Got: $TITLE"
            exit 1
          fi

  # Single required status for branch protection. Stable name even if jobs change.
  ci-ok:
    if: always()
    needs: [check, browser, audit, pr-title]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed (skipped is fine)
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ join(needs.*.result, ' ') }}' | grep -Eq 'failure|cancelled'; then exit 1; fi
